<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>김희정 · 할 수 있다</title>
<meta name="viewport" content="width=1080, height=1920">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body.play { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #main { position: relative; width: 1080px; height: 1920px; flex: none; }
  canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-width="1080" data-height="1920" data-duration="15">
  <canvas id="cv" width="1080" height="1920"></canvas>
</div>
<script>
/* 9:16, 15 s, 60 fps. Every pixel is a pure function of t inside seek(t): no timers, no transitions, no state between frames.
   One accent (orange = "the dot"). Beats sit on a 120 BPM grid (0.5 s) so a track can be laid under it later. */
const W = 1080, H = 1920, DUR = 15;
const C = { paper: '#F4F1EA', ink: '#121212', orange: '#FF5A1F', grey: '#CFC9BE', soft: '#6B665E' };
const FONT = '"Pretendard Variable","Pretendard","Malgun Gothic",sans-serif';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eIO = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eBack = (u, s = 1.2) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
/* closed-form underdamped spring step response: 0 -> 1 with overshoot */
function spring(t, z = .55, w = 16) {
  if (t <= 0) return 0;
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
/* the graph spring: the dot and the drawn curve both read THIS function */
const GZ = .32, GW_ = 7.5;
const gspring = tau => spring(tau, GZ, GW_);

function font(size, weight) { return `${weight} ${size}px ${FONT}`; }
function layoutLine(str, size, weight, baseline) {
  ctx.font = font(size, weight);
  const chars = [...str], ws = chars.map(c => ctx.measureText(c).width);
  let x = W / 2 - ws.reduce((a, b) => a + b, 0) / 2;
  return chars.map((c, i) => { const o = { c, x: x + ws[i] / 2, y: baseline, size, weight, w: ws[i] }; x += ws[i]; return o; });
}
function glyph(c, x, y, size, weight, color, rot = 0, sc = 1) {
  if (sc <= 0.002 || c === ' ') return;
  ctx.save(); ctx.translate(x, y - size * .36); ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(c, 0, size * .36); ctx.restore();
}
function dot(x, y, r, color = C.orange) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
function rrect(cx, cy, w, h, r, rot, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, Math.min(r, w / 2, h / 2)); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function cursor(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(2.3 * sc, 2.3 * sc);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 29); ctx.lineTo(7.5, 22.5); ctx.lineTo(12.5, 34); ctx.lineTo(17.5, 31.8); ctx.lineTo(12.6, 20.6); ctx.lineTo(22.5, 20.6); ctx.closePath();
  ctx.fillStyle = C.ink; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.paper; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

/* ---------- layout (measured once fonts are loaded) ---------- */
let L1, L2, F, END_N, END_R, END_M, ORBIT, PERIOD, END_PERIOD;
const TX = 540, TY = 1260, TRACK_W = 230, TRACK_H = 124, KNOB_R = 48, KNOB_OFF = TX - 53, KNOB_ON = TX + 53;
const CUR0 = [870, 1580];
const KEEP = { 2: 0, 4: 2, 7: 4, 8: 5 };           // L2 index -> F index ("못 할 수도 있다" -> "할 수 있다")
const G = { x: 150, y: 1360, w: 780, h: 520 };      // main graph
const G2 = { x: 160, y: 1520, w: 760, h: 300 };     // return graph
function buildLayout() {
  L1 = layoutLine('AI는 어렵다', 118, 800, 700);
  L2 = layoutLine('못 할 수도 있다', 118, 800, 850);
  F = layoutLine('할 수 있다', 176, 800, 1010);
  const lf = F[F.length - 1]; PERIOD = [lf.x + lf.w / 2 + 30, 1010 - 17];
  END_N = layoutLine('김희정', 230, 800, 860);
  END_R = layoutLine('생성형 AI 실무 활용 전문 강사', 56, 600, 990);
  END_M = layoutLine('나도 할 수 있다', 100, 800, 1220);
  const lm = END_M[END_M.length - 1]; END_PERIOD = [lm.x + lm.w / 2 + 20, 1220 - 10];
  // orbit: course topics from the profile, laid along one circle
  const words = ['ChatGPT 실무', 'AI 콘텐츠 제작', '업무 자동화', 'AI 입문', '실습 코칭'];
  let size = 56; const R = 340, GAP = 64;
  ctx.font = font(size, 700);
  let total = words.reduce((a, w) => a + ctx.measureText(w).width, 0) + GAP * words.length;
  if (total > Math.PI * 2 * R * .96) { size *= Math.PI * 2 * R * .96 / total; ctx.font = font(size, 700); total = words.reduce((a, w) => a + ctx.measureText(w).width, 0) + GAP * words.length; }
  ORBIT = { R, size, letters: [] };
  let arc = 0;
  words.forEach((w, wi) => { [...w].forEach(c => { const cw = ctx.measureText(c).width; ORBIT.letters.push({ c, a: (arc + cw / 2) / R, wi }); arc += cw; }); arc += GAP; });
  ORBIT.letters.forEach((l, i) => l.i = i);
}

/* ---------- scene pieces ---------- */
function drawOpeningLetters(t) {
  // removed letters bend away after the click; on the loop they bend back in (same function reversed)
  const all = [...L1.map((o, i) => ({ o, line: 1, i })), ...L2.map((o, i) => ({ o, line: 2, i }))];
  let k = 0, r = 0;
  all.forEach((e, n) => {
    if (e.o.c === ' ') return;
    const kept = e.line === 2 && KEEP[e.i] !== undefined;
    const dir = (n % 2 ? 1 : -1);
    // loop return: every letter of the label bends back into place
    if (t >= 14.3) {
      const s = 14.3 + n * .018, u = 1 - eOut(seg(t, s, s + .38));
      bend(e.o, u, dir); return;
    }
    if (kept) return;
    const s = 1.08 + (k++) * .035;
    if (t < s + .42) bend(e.o, seg(t, s, s + .42), dir);
  });
  function bend(o, u, dir) {
    const q = eIn(u);
    glyph(o.c, o.x + dir * 140 * q, o.y + 560 * q - 90 * Math.sin(Math.PI * u), o.size, o.weight, C.ink, dir * 1.25 * q, 1 - q);
  }
}
function drawHeroWord(t) {
  // kept letters spring into "할 수 있다"; the orange dot is its full stop; drifts, then drops away as the dot jumps
  if (t >= 3.5 || t >= 14.3) return;
  const drift = 1 + .03 * seg(t, 2.3, 3.0);
  const tf = (x, y) => [540 + (x - 540) * drift, 960 + (y - 960) * drift];
  Object.entries(KEEP).forEach(([li, fi], j) => {
    const a = L2[li], b = F[fi];
    const v = spring(t - (1.3 + j * .05), .58, 15);
    let x = lerp(a.x, b.x, v), y = lerp(a.y, b.y, v), size = lerp(a.size, b.size, v);
    [x, y] = tf(x, y); size *= drift;
    const d = seg(t, 3.0 + j * .03, 3.36 + j * .03), q = eIn(d);
    glyph(a.c, x, y + 760 * q, size, 800, C.ink, (j % 2 ? 1 : -1) * .6 * q, 1 - q);
  });
  return tf(...PERIOD);
}
function periodAt(t) { const drift = 1 + .03 * seg(t, 2.3, 3.0); return [540 + (PERIOD[0] - 540) * drift, 960 + (PERIOD[1] - 960) * drift]; }

function drawToggle(t) {
  // returns the knob position/radius (the knob IS the orange dot)
  let knobX, trackW = TRACK_W, trackC = TX, color = C.grey, show = true;
  if (t < 1.95) {
    knobX = t < 1.0 ? KNOB_OFF : lerp(KNOB_OFF, KNOB_ON, spring(t - 1.0, .5, 18));
    if (t >= 1.0) color = C.ink;
    const u = eIO(seg(t, 1.6, 1.95)); trackW = lerp(TRACK_W, KNOB_R * 2, u); trackC = lerp(TX, knobX, u);
    if (u >= 1) show = false;
  } else if (t >= 14.42) {
    color = C.ink;
    const g = eOut(seg(t, 14.42, 14.62)); trackW = lerp(KNOB_R * 2, TRACK_W, g); trackC = lerp(KNOB_ON, TX, g);
    knobX = KNOB_ON;
    if (t >= 14.62) { color = C.grey; knobX = lerp(KNOB_ON, KNOB_OFF, eBack(seg(t, 14.62, 14.92), 1.3)); }
  } else return null;
  if (show) rrect(trackC, TY, trackW, TRACK_H, TRACK_H / 2, 0, color);
  return [knobX, TY];
}
function drawCursor(t) {
  let x, y, sc = 1;
  if (t < 1.2) {
    const u = eIO(seg(t, .15, .9)); x = lerp(CUR0[0], KNOB_OFF + 6, u); y = lerp(CUR0[1], TY + 8, u);
    const p = seg(t, .95, 1.1); sc = 1 - .18 * Math.sin(Math.PI * p);                      // press squash
  } else if (t < 1.6) {
    const u = eIn(seg(t, 1.2, 1.55)); x = lerp(KNOB_OFF + 6, 1300, u); y = lerp(TY + 8, 2150, u);
  } else if (t >= 14.45) {
    const u = eOut(seg(t, 14.45, 14.95)); x = lerp(1300, CUR0[0], u); y = lerp(2150, CUR0[1], u);
  } else return;
  cursor(x, y, sc);
}

function graphPath(g, tauEnd, tauStart, dur) {
  ctx.beginPath();
  const n = Math.max(2, Math.ceil((tauEnd - tauStart) * 120));
  for (let i = 0; i <= n; i++) {
    const tau = lerp(tauStart, tauEnd, i / n);
    const x = g.x + g.w * (tau / dur), y = g.y - g.h * gspring(tau);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = C.ink; ctx.stroke();
}
function drawGraph(t) {
  // 3.0-5.35: axes, spring trace, 300명 callout; retracts toward the dot as it leaves
  if (t < 3.0 || t >= 5.35) return;
  const grow = eOut(seg(t, 3.0, 3.35)), shrink = eIn(seg(t, 5.0, 5.3));
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.ink; ctx.lineWidth = 5;
  const ax = 1 - shrink;
  if (ax > 0) {
    ctx.beginPath(); ctx.moveTo(G.x, G.y); ctx.lineTo(G.x, G.y - 620 * grow * ax);
    ctx.moveTo(G.x, G.y); ctx.lineTo(G.x + (G.w + 30) * grow * ax, G.y); ctx.stroke();
    // target line
    const tl = eOut(seg(t, 3.3, 3.6)) * ax;
    ctx.setLineDash([14, 14]); ctx.strokeStyle = C.grey; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(G.x, G.y - G.h); ctx.lineTo(G.x + (G.w + 30) * tl, G.y - G.h); ctx.stroke(); ctx.setLineDash([]);
  }
  if (t >= 3.5) {
    const tau = Math.min(t - 3.5, 1.5);
    graphPath(G, tau, 1.5 * shrink, 1.5);
  }
  // callout
  if (t >= 4.5) {
    const v = spring(t - 4.5, .5, 16), out = eIn(seg(t, 5.0, 5.22));
    const sc = lerp(.55, 1, v) * (1 - out);
    ctx.save(); ctx.translate(900, 1140); ctx.scale(sc, sc);
    ctx.font = font(150, 800); ctx.fillStyle = C.ink; ctx.textAlign = 'right'; ctx.fillText('300명', 0, 0);
    ctx.font = font(46, 600); ctx.fillStyle = C.soft; ctx.fillText("생성형 AI 특강 수강생", 0, 72);
    ctx.restore();
  }
}

function drawShape(t) {
  // one shape: the dot grows into the orange field; inside it a black square rotates and stretches into a pill; all contracts back to a dot
  const S = 1 - eIO(seg(t, 7.5, 8.0)) * (1 - 26 / 1180);   // contraction factor
  const R = lerp(22, 1180, eIO(seg(t, 5.35, 5.95))) * (t >= 7.5 ? S : 1);
  dot(540, 960, t >= 7.5 ? 1180 * S : R);
  if (t < 6.0 || S < .06) return;
  const s = 360 * spring(t - 6.0, .5, 14);
  const w = lerp(s, 800, eBack(seg(t, 6.5, 7.0), 1.0)), h = lerp(s, 210, eBack(seg(t, 6.5, 7.0), 1.0));
  const rad = lerp(52, 105, seg(t, 6.5, 7.0));
  const rot = (Math.PI / 2) * eIO(seg(t, 6.05, 6.5)) + (Math.PI / 2) * eBack(seg(t, 6.5, 7.0), 1.0);
  ctx.save(); ctx.translate(540, 960); ctx.scale(S, S); ctx.translate(-540, -960);
  rrect(540, 960, w, h, rad, rot, C.ink);
  if (t >= 7.0) {
    const txt = [...'실무 중심 AI 교육'];
    ctx.font = font(66, 700);
    const ws = txt.map(c => ctx.measureText(c).width); let x = 540 - ws.reduce((a, b) => a + b, 0) / 2;
    txt.forEach((c, i) => { const v = spring(t - 7.0 - i * .02, .55, 18); glyph(c, x + ws[i] / 2, 984, 66, 700, C.paper, 0, v); x += ws[i]; });
  }
  ctx.restore();
}

function drawOrbit(t) {
  if (t < 8.0 || t >= 10.8) return;
  const th0 = -Math.PI / 2 + .55 * (t - 8.0);
  ORBIT.letters.forEach(l => {
    const v = spring(t - 8.0 - l.wi * .06, .62, 12);
    const d0 = 10.0 + l.i * .012, o = eIn(seg(t, d0, d0 + .55)), q = eIO(seg(t, d0, d0 + .28));
    const R = ORBIT.R * v + 1500 * o;
    const a = th0 + l.a;
    const x = 540 + Math.cos(a) * R, y = 960 + Math.sin(a) * R;
    glyph(l.c, x, y + ORBIT.size * .36, ORBIT.size, 700, C.paper, a + Math.PI / 2, v * (1 - q));
    if (q > 0) dot(x, y, 6 * q, C.paper);
  });
}
function halftoneDotPos(t) {
  const ph = 2 * Math.PI * eIO(seg(t, 10.5, 11.9));
  return [540 + 170 * Math.sin(ph), 960 - 170 * (1 - Math.cos(ph))];
}
function drawHalftone(t) {
  if (t < 10.15 || t >= 12.0) return;
  const sp = 44 * lerp(1, 2.6, eIn(seg(t, 10.8, 12.0)));
  const [dx, dy] = halftoneDotPos(t);
  const front = 1500 * eOut(seg(t, 10.15, 10.9));
  const m = eIn(seg(t, 11.45, 12.0));
  const nx = Math.ceil(540 / sp) + 2, ny = Math.ceil(960 / sp) + 2;
  ctx.fillStyle = C.paper;
  for (let ix = -nx; ix <= nx; ix++) for (let iy = -ny; iy <= ny; iy++) {
    const x = 540 + ix * sp, y = 960 + iy * sp;
    const dc = Math.hypot(x - 540, y - 960), d = Math.hypot(x - dx, y - dy);
    const rev = clamp((front - dc) / 160);
    const base = sp * (.10 + .30 * Math.exp(-d / 360));
    const r = lerp(base, sp * .76, m) * rev;
    if (r > .3) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  }
}
function drawEndCard(t) {
  if (t < 12.0) return;
  const lines = [[END_N, 12.0, C.ink], [END_R, 12.12, C.soft], [END_M, 12.24, C.ink]];
  let n = 0;
  lines.forEach(([L, s0, col]) => L.forEach((o, i) => {
    const v = spring(t - s0 - i * .022, .6, 14);
    const ex = eIn(seg(t, 13.6 + n * .012, 13.9 + n * .012)); n++;
    glyph(o.c, o.x, o.y + 110 * (1 - v) + 700 * ex, o.size, o.weight, col, (i % 2 ? 1 : -1) * .5 * ex, (.6 + .4 * v) * (1 - ex));
  }));
}

/* ---------- the dot: one path through the whole film ---------- */
function dotState(t) {
  if (t < 1.95) return null;                                         // inside the toggle (drawn as knob)
  if (t < 2.45) {                                                    // knob -> full stop of "할 수 있다"
    const u = eIO(seg(t, 1.95, 2.45)), [px, py] = PERIOD;
    const x = lerp(KNOB_ON, px, u), y = lerp(TY, py, u) - 220 * Math.sin(Math.PI * u);
    return [x, y, lerp(KNOB_R, 19, u)];
  }
  if (t < 3.0) { const [x, y] = periodAt(t); return [x, y, 19 * (1 + .03 * seg(t, 2.3, 3.0))]; }
  if (t < 3.5) {                                                     // jump to the graph origin
    const u = seg(t, 3.0, 3.5), [px, py] = periodAt(3.0), e = eIO(u);
    return [lerp(px, G.x, e), lerp(py, G.y, e) - 360 * Math.sin(Math.PI * u), lerp(19, 22, u)];
  }
  if (t < 5.0) { const tau = Math.min(t - 3.5, 1.5); return [G.x + G.w * (tau / 1.5), G.y - G.h * gspring(tau), 22]; }
  if (t < 5.35) {                                                    // shoots along a line to the centre
    const u = eIO(seg(t, 5.0, 5.35)), sx = G.x + G.w, sy = G.y - G.h * gspring(1.5);
    const x = lerp(sx, 540, u), y = lerp(sy, 960, u);
    const tail = eIO(seg(t, 5.08, 5.35));
    ctx.beginPath(); ctx.moveTo(lerp(sx, 540, tail), lerp(sy, 960, tail)); ctx.lineTo(x, y); ctx.lineWidth = 8; ctx.strokeStyle = C.orange; ctx.lineCap = 'round'; ctx.stroke();
    return [x, y, 22];
  }
  if (t < 8.0) return null;                                          // drawn by drawShape
  if (t < 10.5) return [540, 960, 26];
  if (t < 12.15) { const [x, y] = halftoneDotPos(t); return [x, y, 26]; }
  if (t < 13.6) {                                                    // into the end card's full stop
    const u = eBack(seg(t, 12.15, 12.55), 1.1), [ex, ey] = END_PERIOD;
    return [lerp(540, ex, u), lerp(960, ey, u), lerp(26, 13, clamp(u))];
  }
  if (t < 13.95) {                                                   // return: through a halftone bloom
    const u = eIO(seg(t, 13.6, 13.95));
    return [lerp(END_PERIOD[0], 540, u), lerp(END_PERIOD[1], 1080, u) - 120 * Math.sin(Math.PI * u), lerp(13, 22, u)];
  }
  if (t < 14.05) { const u = eIO(seg(t, 13.95, 14.05)); return [lerp(540, G2.x, u), lerp(1080, G2.y, u), 22]; }
  if (t < 14.3) { const tau = 1.5 * seg(t, 14.05, 14.3); return [G2.x + G2.w * (tau / 1.5), G2.y - G2.h * gspring(tau), 22]; }
  if (t < 14.42) {                                                   // back into the toggle knob
    const u = eIO(seg(t, 14.3, 14.42)), sx = G2.x + G2.w, sy = G2.y - G2.h * gspring(1.5);
    return [lerp(sx, KNOB_ON, u), lerp(sy, TY, u), lerp(22, KNOB_R, u)];
  }
  return null;
}
function drawReturnTraces(t) {
  if (t >= 13.6 && t < 14.0) {                                       // halftone bloom around the travelling dot
    const b = Math.sin(Math.PI * seg(t, 13.6, 14.0)), st = dotState(t), sp = 40;
    ctx.fillStyle = C.ink;
    for (let x = 0; x <= W; x += sp) for (let y = 600; y <= 1500; y += sp) {
      const d = Math.hypot(x - st[0], y - st[1]); if (d > 360) continue;
      const r = 11 * b * Math.exp(-d / 170); if (r > .4) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  if (t >= 14.05 && t < 14.42) {                                     // the same spring, drawn small
    const tau = 1.5 * seg(t, 14.05, 14.3), tail = 1.5 * eIn(seg(t, 14.28, 14.42));
    if (tau > tail) graphPath(G2, tau, tail, 1.5);
  }
}

/* ---------- frame ---------- */
function seek(t) {
  t = clamp(t, 0, DUR);
  // ground: paper, then black under the orange field until the halftone flips it back to paper
  ctx.fillStyle = (t >= 5.95 && t < 12.0) ? C.ink : C.paper; ctx.fillRect(0, 0, W, H);

  drawOpeningLetters(t);
  drawHeroWord(t);
  const knob = drawToggle(t);
  drawGraph(t);
  if (t >= 5.35 && t < 8.0) drawShape(t);
  drawOrbit(t);
  drawHalftone(t);
  drawEndCard(t);
  drawReturnTraces(t);
  const st = dotState(t);
  if (st) dot(st[0], st[1], st[2]);
  if (knob) dot(knob[0], knob[1], KNOB_R);
  drawCursor(t);
}

window.__duration = DUR;
window.__seek = seek;
window.__ready = (async () => {
  await Promise.all([document.fonts.load(font(100, 800)), document.fonts.load(font(100, 700)), document.fonts.load(font(100, 600))]);
  await document.fonts.ready;
  buildLayout(); seek(0);
})();

/* browser preview only: index.html?play loops in real time (render.mjs never passes ?play) */
if (/[?&]play/.test(location.search)) window.__ready.then(() => {
  document.body.classList.add('play');
  const fit = () => { document.getElementById('main').style.zoom = Math.min(innerWidth / 1080, innerHeight / 1920); };
  addEventListener('resize', fit); fit();
  const t0 = performance.now();
  const tick = now => { seek(((now - t0) / 1000) % DUR); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
</script>
