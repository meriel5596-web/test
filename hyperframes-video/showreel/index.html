<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[{"id":"ground","type":"color","label":"배경","default":"#0A0A0F"},{"id":"ink","type":"color","label":"글자","default":"#FFFFFF"},{"id":"accent","type":"color","label":"강조","default":"#2F6BFF"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* 김희정 쇼릴 · 1080×1920 · 30fps · 15초 · 장면 4개
         Music: Mixkit "Tech House vibes" from 12.35 s → a bar starts at 0, 3.933, 7.867, 11.8 (122 BPM, beat 0.491 s).
         Every scene change sits on a bar line. */
      :root {
        --ground: #0a0a0f;
        --ink: #ffffff;
        --accent: #2f6bff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
      data-motion-blur="on"
    >
      <div id="slam" data-composition-id="slam" data-composition-src="compositions/slam.html"
        data-start="0" data-duration="3.933" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="count" data-composition-id="count" data-composition-src="compositions/count.html"
        data-start="3.933" data-duration="3.934" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="punch" data-composition-id="punch" data-composition-src="compositions/punch.html"
        data-start="7.867" data-duration="3.933" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="card" data-composition-id="card" data-composition-src="compositions/card.html"
        data-start="11.8" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
