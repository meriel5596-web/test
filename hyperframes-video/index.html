<!doctype html>
<html
  lang="ko"
  data-resolution="portrait"
  data-composition-variables='[{"id":"ground","type":"color","label":"배경","default":"#0B2A6B"},{"id":"ink","type":"color","label":"글자","default":"#FFFFFF"},{"id":"accent","type":"color","label":"강조","default":"#5AA9FF"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* 김희정 강사 홍보 릴스 · 1080×1920 · 30fps · 15초 · 장면 4개 */
      :root {
        --ground: #0b2a6b;
        --ink: #ffffff;
        --accent: #5aa9ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
      /* one ground for the whole film: a lighter pool of navy behind the text band */
      #ground-glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 900px 1100px at 50% 44%,
          color-mix(in srgb, var(--accent) 22%, var(--ground)) 0%,
          var(--ground) 70%
        );
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground-glow"></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="career"
        data-composition-id="career"
        data-composition-src="compositions/career.html"
        data-start="3.6"
        data-duration="3.867"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="shift"
        data-composition-id="shift"
        data-composition-src="compositions/shift.html"
        data-start="7.467"
        data-duration="3.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="11.267"
        data-duration="3.733"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
