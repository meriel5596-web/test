<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 집 장보기</title>
<style>
  :root {
    --green: #2f9e58;
    --green-dark: #23794a;
    --green-soft: #e8f6ee;
    --text: #1f2a24;
    --muted: #8a968f;
    --line: #e6ece8;
    --bg: #fde4ec;
    --card: #ffffff;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }

  header { margin-bottom: 18px; }
  h1 { margin: 0 0 6px; font-size: 26px; color: var(--green-dark); letter-spacing: -0.5px; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .3s ease; }

  .add {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--card); padding: 12px; border-radius: 16px;
    box-shadow: 0 2px 10px rgba(30, 80, 50, .06); margin-bottom: 18px;
  }
  .add input, .add select {
    font: inherit; font-size: 15px; padding: 10px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text);
  }
  .add input { flex: 1 1 160px; min-width: 0; }
  .add input:focus, .add select:focus { outline: none; border-color: var(--green); }
  .add button {
    font: inherit; font-size: 15px; font-weight: 600; padding: 10px 18px;
    background: var(--green); color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  .add button:hover { background: var(--green-dark); }

  .card {
    background: var(--card); border-radius: 18px; padding: 14px 14px 8px;
    box-shadow: 0 2px 10px rgba(30, 80, 50, .06); margin-bottom: 14px;
  }
  .card h2 {
    margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px;
  }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 4px; border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  .check {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid #c7d3cb; background: #fff; cursor: pointer;
    display: grid; place-items: center; color: #fff; font-size: 15px; padding: 0;
    transition: background .15s, border-color .15s;
  }
  .check:hover { border-color: var(--green); }
  li.done .check { background: var(--green); border-color: var(--green); }
  .name { flex: 1; font-size: 16px; cursor: pointer; user-select: none; word-break: break-all; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  .del {
    flex: none; border: 0; background: none; cursor: pointer; padding: 6px;
    border-radius: 8px; font-size: 16px; opacity: .45;
  }
  .del:hover { opacity: 1; background: #fdeeee; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 4px 10px; }

  .reset {
    display: block; width: 100%; margin-top: 8px;
    font: inherit; font-size: 15px; font-weight: 600; padding: 14px;
    background: var(--green-soft); color: var(--green-dark);
    border: 1.5px dashed var(--green); border-radius: 14px; cursor: pointer;
  }
  .reset:hover { background: #dcf1e4; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🥬 우리 집 장보기</h1>
    <p class="count" id="count"></p>
    <div class="bar"><span id="bar"></span></div>
  </header>

  <form class="add" id="addForm">
    <input id="newName" type="text" placeholder="살 것을 적어 주세요 (예: 버섯)" autocomplete="off" required>
    <select id="newCat" aria-label="종류"></select>
    <button type="submit">추가</button>
  </form>

  <main id="list"></main>

  <button class="reset" id="reset">🔄 다음 장보기 준비 (체크 모두 풀기)</button>
</div>

<script>
  const KEY = "our-shopping-list-v1";
  const CATEGORIES = [
    { id: "veg",   label: "🥕 채소·과일" },
    { id: "meat",  label: "🥩 고기·생선" },
    { id: "dairy", label: "🥛 유제품·달걀" },
    { id: "home",  label: "🧻 생활용품" },
  ];
  const DEFAULTS = {
    veg: ["양파", "대파", "감자", "사과"],
    meat: ["돼지고기", "닭가슴살"],
    dairy: ["계란", "우유", "두부"],
    home: ["휴지", "주방세제"],
  };

  let items = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(saved)) return saved;
    } catch (e) {}
    const list = [];
    for (const cat in DEFAULTS) {
      DEFAULTS[cat].forEach(name => list.push({ id: uid(), name, cat, done: false }));
    }
    return list;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  const listEl = document.getElementById("list");
  const catSelect = document.getElementById("newCat");
  CATEGORIES.forEach(c => catSelect.add(new Option(c.label, c.id)));

  function render() {
    listEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      // 안 산 것 위, 체크한 것 아래
      const inCat = items.filter(i => i.cat === c.id);
      const sorted = [...inCat.filter(i => !i.done), ...inCat.filter(i => i.done)];
      const left = inCat.filter(i => !i.done).length;

      const card = document.createElement("section");
      card.className = "card";
      const h2 = document.createElement("h2");
      h2.textContent = c.label;
      const small = document.createElement("small");
      small.textContent = inCat.length ? `${left}개 남음` : "";
      h2.appendChild(small);
      card.appendChild(h2);

      const ul = document.createElement("ul");
      if (!sorted.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "아직 항목이 없어요";
        card.appendChild(p);
      }
      sorted.forEach(item => {
        const li = document.createElement("li");
        if (item.done) li.className = "done";

        const check = document.createElement("button");
        check.className = "check";
        check.setAttribute("aria-label", item.done ? "체크 풀기" : "체크하기");
        check.textContent = item.done ? "✓" : "";
        check.onclick = () => toggle(item.id);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        name.onclick = () => toggle(item.id);

        const del = document.createElement("button");
        del.className = "del";
        del.setAttribute("aria-label", item.name + " 삭제");
        del.textContent = "🗑️";
        del.onclick = () => remove(item.id);

        li.append(check, name, del);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      listEl.appendChild(card);
    });

    const total = items.length;
    const done = items.filter(i => i.done).length;
    document.getElementById("count").textContent =
      total ? `${total}개 중 ${done}개 담음` : "목록이 비어 있어요";
    document.getElementById("bar").style.width = total ? (done / total * 100) + "%" : "0";
  }

  function toggle(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save(); render();
  }
  function remove(id) {
    items = items.filter(i => i.id !== id);
    save(); render();
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("newName");
    const name = input.value.trim();
    if (!name) return;
    items.push({ id: uid(), name, cat: catSelect.value, done: false });
    input.value = "";
    input.focus();
    save(); render();
  });

  document.getElementById("reset").addEventListener("click", () => {
    if (!items.some(i => i.done)) return;
    if (confirm("체크를 모두 풀까요? 항목은 그대로 남아요.")) {
      items.forEach(i => i.done = false);
      save(); render();
    }
  });

  render();
</script>
</body>
</html>
