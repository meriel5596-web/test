<title>우리 집 장보기</title>
<style>
  /* 한 줄 레이아웃: 진행 머리글 → 추가 줄 → 종류별 카드 → 다음 장보기 준비 */
  :root {
    --green: #2f9e58;
    --green-dark: #23794a;
    --green-soft: #e8f6ee;
    --on-green: #ffffff;
    --text: #1f2a24;
    --muted: #7d8a83;
    --line: #ece4e8;
    --bg: #fde4ec;
    --card: #ffffff;
    --field: #ffffff;
    --ring: #c7d3cb;
    --danger: #c9433f;
    --danger-soft: #fdeeee;
    --shadow: 0 2px 10px rgba(120, 40, 70, .07);
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --green: #4cc27a; --green-dark: #7bd9a0; --green-soft: #1d3327; --on-green: #0e1a13;
      --text: #f1ecef; --muted: #a59aa0; --line: #3a2f35; --bg: #2a1d24; --card: #36272f;
      --field: #2a1d24; --ring: #6b5c64; --danger: #f08a86; --danger-soft: #4a2a2c;
      --shadow: 0 2px 10px rgba(0, 0, 0, .3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --green: #4cc27a; --green-dark: #7bd9a0; --green-soft: #1d3327; --on-green: #0e1a13;
    --text: #f1ecef; --muted: #a59aa0; --line: #3a2f35; --bg: #2a1d24; --card: #36272f;
    --field: #2a1d24; --ring: #6b5c64; --danger: #f08a86; --danger-soft: #4a2a2c;
    --shadow: 0 2px 10px rgba(0, 0, 0, .3); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }

  header h1 { margin: 0 0 6px; font-size: 26px; color: var(--green-dark); letter-spacing: -0.5px; text-wrap: balance; }
  .count { color: var(--muted); font-size: 14px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--card); border-radius: 99px; overflow: hidden; }
  .bar span { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .3s ease; }

  .notice { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--card); color: var(--muted); font-size: 14px; }

  .add { display: flex; gap: 8px; flex-wrap: wrap; background: var(--card); padding: 12px; border-radius: 16px; box-shadow: var(--shadow); }
  .add input, .add select { font: inherit; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); }
  .add input { flex: 1 1 160px; min-width: 0; }
  .add input:focus-visible, .add select:focus-visible { outline: none; border-color: var(--green); }
  .btn { font: inherit; font-size: 15px; font-weight: 600; padding: 10px 18px; background: var(--green); color: var(--on-green); border: 0; border-radius: 10px; cursor: pointer; }
  .btn:hover { filter: brightness(.95); }
  .btn:focus-visible, .check:focus-visible, .del:focus-visible, .reset:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .card { background: var(--card); border-radius: 18px; padding: 14px 14px 8px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 6px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ring); background: var(--field); cursor: pointer; display: grid; place-items: center; color: var(--on-green); font-size: 15px; padding: 0; transition: background .15s, border-color .15s; }
  .check:hover { border-color: var(--green); }
  li.done .check { background: var(--green); border-color: var(--green); }
  .name { flex: 1; min-width: 0; font-size: 16px; cursor: pointer; user-select: none; overflow-wrap: anywhere; }
  li.done .name { text-decoration: line-through; color: var(--muted); }
  .del { flex: none; border: 0; background: none; cursor: pointer; padding: 6px; border-radius: 8px; font-size: 16px; opacity: .45; }
  .del:hover { opacity: 1; background: var(--danger-soft); }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 4px 10px; margin: 0; }
  .readonly .check, .readonly .name { cursor: default; }

  .reset { width: 100%; font: inherit; font-size: 15px; font-weight: 600; padding: 14px; background: var(--green-soft); color: var(--green-dark); border: 1.5px dashed var(--green); border-radius: 14px; cursor: pointer; }
  .confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--card); padding: 12px 14px; border-radius: 14px; box-shadow: var(--shadow); }
  .confirm p { margin: 0; font-size: 15px; }
  .confirm div { display: flex; gap: 8px; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>🥬 우리 집 장보기</h1>
    <p class="count" id="count">목록을 불러오는 중이에요</p>
    <div class="bar"><span id="bar"></span></div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <form class="add" id="addForm">
    <input id="newName" type="text" placeholder="살 것을 적어 주세요 (예: 버섯)" autocomplete="off" maxlength="40" required>
    <select id="newCat" aria-label="종류"></select>
    <button class="btn" type="submit">추가</button>
  </form>

  <main id="list"></main>

  <button class="reset" id="reset" type="button">🔄 다음 장보기 준비 (체크 모두 풀기)</button>
  <div class="confirm" id="confirm" hidden>
    <p>체크를 모두 풀까요? 항목은 그대로 남아요.</p>
    <div>
      <button class="btn ghost" id="confirmNo" type="button">취소</button>
      <button class="btn" id="confirmYes" type="button">모두 풀기</button>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = [
    { id: "veg",   label: "🥕 채소·과일" },
    { id: "meat",  label: "🥩 고기·생선" },
    { id: "dairy", label: "🥛 유제품·달걀" },
    { id: "home",  label: "🧻 생활용품" },
  ];

  let items = [];      // 저장소에서 받은 목록
  let col = null;      // 함께 쓰는 저장소의 items 모음
  let canWrite = false;
  let loaded = false;

  const $ = id => document.getElementById(id);
  const listEl = $("list");
  CATEGORIES.forEach(c => $("newCat").add(new Option(c.label, c.id)));

  function showNotice(text) {
    $("notice").textContent = text;
    $("notice").hidden = !text;
  }

  function setWritable(on) {
    canWrite = on;
    $("addForm").hidden = !on;
    $("reset").hidden = !on;
    if (!on) $("confirm").hidden = true;
    document.body.classList.toggle("readonly", !on);
  }

  function render() {
    listEl.innerHTML = "";
    CATEGORIES.forEach(c => {
      // 안 산 것 위, 체크한 것 아래
      const inCat = items.filter(i => i.cat === c.id);
      const sorted = [...inCat.filter(i => !i.done), ...inCat.filter(i => i.done)];
      const left = inCat.filter(i => !i.done).length;

      const card = document.createElement("section");
      card.className = "card";
      const h2 = document.createElement("h2");
      h2.textContent = c.label;
      const small = document.createElement("small");
      small.textContent = inCat.length ? `${left}개 남음` : "";
      h2.appendChild(small);
      card.appendChild(h2);

      if (!sorted.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = loaded ? "아직 항목이 없어요. 위 칸에 적어서 추가해 보세요" : "불러오는 중…";
        card.appendChild(p);
      }
      const ul = document.createElement("ul");
      sorted.forEach(item => {
        const li = document.createElement("li");
        if (item.done) li.className = "done";

        const check = document.createElement("button");
        check.className = "check";
        check.type = "button";
        check.setAttribute("aria-label", item.done ? item.name + " 체크 풀기" : item.name + " 체크하기");
        check.textContent = item.done ? "✓" : "";
        check.disabled = !canWrite;
        check.onclick = () => toggle(item);

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = item.name;
        name.onclick = () => toggle(item);

        li.append(check, name);
        if (canWrite) {
          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.setAttribute("aria-label", item.name + " 삭제");
          del.textContent = "🗑️";
          del.onclick = () => remove(item);
          li.appendChild(del);
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
      listEl.appendChild(card);
    });

    const total = items.length;
    const done = items.filter(i => i.done).length;
    $("count").textContent = !loaded ? "목록을 불러오는 중이에요"
      : total ? `${total}개 중 ${done}개 담음` : "목록이 비어 있어요";
    $("bar").style.width = total ? (done / total * 100) + "%" : "0";
  }

  async function write(fn) {
    try { await fn(); }
    catch (e) {
      if (e && e.code === "invalid_argument" && canWrite) {
        setWritable(false);
        showNotice("이 목록은 보기만 할 수 있어요. 체크하려면 목록 주인에게 편집 권한을 받아 주세요.");
        render();
      } else if (e && e.code === "quota_exceeded") {
        showNotice("항목이 너무 많아요. 필요 없는 항목을 지운 뒤 다시 추가해 주세요.");
      } else {
        showNotice("저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.");
      }
    }
  }

  function toggle(item) {
    if (!canWrite || !col) return;
    write(() => col.doc(item.id).update({ done: !item.done }));
  }
  function remove(item) {
    if (!canWrite || !col) return;
    write(() => col.doc(item.id).delete());
  }

  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = $("newName");
    const name = input.value.trim();
    if (!name || !col) return;
    input.value = "";
    input.focus();
    write(() => col.add({ name, cat: $("newCat").value, done: false, at: Date.now() }));
  });

  $("reset").addEventListener("click", () => {
    if (!items.some(i => i.done)) return;
    $("reset").hidden = true;
    $("confirm").hidden = false;
  });
  $("confirmNo").addEventListener("click", () => {
    $("confirm").hidden = true;
    $("reset").hidden = false;
  });
  $("confirmYes").addEventListener("click", async () => {
    $("confirm").hidden = true;
    $("reset").hidden = false;
    const doneItems = items.filter(i => i.done);
    await write(async () => {
      for (const it of doneItems) await col.doc(it.id).update({ done: false });
    });
  });

  setWritable(false);
  render();

  (async () => {
    const db = window.claude ? await window.claude.use("db") : null;
    if (!db) {
      loaded = true;
      showNotice("함께 쓰는 목록을 불러올 수 없어요. Claude에 로그인한 뒤 공유받은 링크로 열어 주세요.");
      render();
      return;
    }
    col = db.collection("items");

    const user = window.claude ? await window.claude.use("user") : null;
    const allowed = user ? await user.can("data.write") : null;
    // null이면 아직 모름: 일단 쓸 수 있게 두고, 막히면 보기 전용으로 바꿔요
    setWritable(allowed !== false);
    if (allowed === false) showNotice("이 목록은 보기만 할 수 있어요. 체크하려면 목록 주인에게 편집 권한을 받아 주세요.");

    col.orderBy("at").onSnapshot(snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded = true;
      render();
    }, () => {
      showNotice("목록 연결이 끊겼어요. 페이지를 새로고침해 주세요.");
    });
  })();
</script>
